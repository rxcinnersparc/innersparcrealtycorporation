    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f5fb;
            font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }
        
        #gas-iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        
        /* Crawlable text that does not change the full-screen app layout */
        .seo-content {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Error message */
        .error-message {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            border-radius: 12px;
            padding: 24px;
            text-align: center;
            max-width: 90%;
            width: 320px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 1px solid #f5c2c2;
            display: none;
            z-index: 10001;
        }
        
        .error-message.show {
            display: block;
        }

        /* Shared button motion: a restrained shine makes the next action obvious. */
        .close-button,
        .error-button {
            position: relative;
            isolation: isolate;
            overflow: hidden;
            transition: transform 0.22s cubic-bezier(0.22, 1, 0.36, 1),
                        box-shadow 0.22s ease,
                        background 0.22s ease,
                        color 0.22s ease;
        }

        .close-button::after,
        .error-button::after {
            content: '';
            position: absolute;
            inset: 0;
            z-index: -1;
            background: linear-gradient(112deg, transparent 25%, rgba(255,255,255,0.62) 50%, transparent 75%);
            transform: translateX(-140%);
            transition: transform 0.55s ease;
            pointer-events: none;
        }

        .close-button:hover,
        .error-button:hover {
            transform: translateY(-2px);
        }

        .close-button:hover::after,
        .error-button:hover::after {
            transform: translateX(140%);
        }

        .close-button:active,
        .error-button:active {
            transform: translateY(0) scale(0.97);
            transition-duration: 0.08s;
        }

        .close-button:focus-visible,
        .error-button:focus-visible {
            outline: 3px solid rgba(80, 92, 218, 0.35);
            outline-offset: 3px;
        }

        /* Close (x) button */
        .close-button {
            position: absolute;
            top: 10px;
            right: 12px;
            background: transparent;
            border: none;
            font-size: 1.25rem;
            font-weight: bold;
            color: #7b7fa8;
            cursor: pointer;
            line-height: 1;
            padding: 4px 8px;
            border-radius: 50%;
            box-shadow: 0 3px 10px rgba(34, 38, 137, 0.08);
        }

        .close-button:hover {
            color: #333;
            background: #f0f1f7;
            box-shadow: 0 7px 16px rgba(34, 38, 137, 0.14);
        }
        
        .error-icon {
            font-size: 48px;
            margin-bottom: 12px;
        }
        
        .error-title {
            font-size: 1rem;
            font-weight: 800;
            color: #c0392b;
            margin-bottom: 8px;
        }
        
        .error-text {
            font-size: 0.75rem;
            color: #7b7fa8;
            margin-bottom: 16px;
            line-height: 1.5;
        }
        
        .error-button {
            background: #222689;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 700;
            cursor: pointer;
            font-size: 0.75rem;
            box-shadow: 0 6px 14px rgba(34, 38, 137, 0.22);
        }
        
        .error-button:hover {
            background: #1a1d6e;
            box-shadow: 0 10px 22px rgba(34, 38, 137, 0.3);
        }

        @media (prefers-reduced-motion: reduce) {
            .close-button,
            .error-button,
            .close-button::after,
            .error-button::after {
                transition: none;
            }

            .close-button:hover,
            .error-button:hover,
            .close-button:active,
            .error-button:active {
                transform: none;
            }
        }

<body>    
    <section class="seo-content" aria-label="About Inner SPARC Realty Corporation">
        <h1>Inner SPARC Realty Corporation</h1>
        <p>Visit the official website of Inner SPARC Realty Corporation for company information and access to its web application.</p>
    </section>

    <div class="error-message" id="errorMessage">
        <button class="close-button" id="closeErrorModal" aria-label="Close error modal">&times;</button>
        <div class="error-icon">⚠️</div>
        <div class="error-title">Connection Error</div>
        <div class="error-text" id="errorText">
            Unable to load the application. Please check your internet connection and try again.
        </div>
        <button class="error-button" onclick="location.reload()">Retry</button>
    </div>
    
    <iframe id="gas-iframe" title="Inner SPARC Realty Corporation web application" src="about:blank" allow="geolocation; clipboard-read; clipboard-write"></iframe>

    <script>
        // ⚠️ IMPORTANT: Replace this with your actual Google Apps Script Web App URL
        const GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbw4C6TqOXIofHtbXH_R0oPUIYakB0HbPjKqX0zURkLonZk23ZY9weuJ8TcjoXt9PazyFA/exec';
        
        const iframe = document.getElementById('gas-iframe');
        const errorMessage = document.getElementById('errorMessage');
        const errorText = document.getElementById('errorText');
        const closeErrorModal = document.getElementById('closeErrorModal');
        
        let hasLoaded = false;
        let loadTimeout;
        
        // Function to hide error modal
        function hideError() {
            errorMessage.classList.remove('show');
        }

        // Event listener for close button
        closeErrorModal.addEventListener('click', hideError);

        // Optional: Allow pressing ESC to close modal
        window.addEventListener('keydown', function(event) {
            if (event.key === 'Escape' && errorMessage.classList.contains('show')) {
                hideError();
            }
        });

        // Function to show error
        function showError(message) {
            if (hasLoaded) return;
            
            clearTimeout(loadTimeout);
            errorText.textContent = message || 'Unable to load the application. Please check your internet connection and try again.';
            errorMessage.classList.add('show');
        }
        
        // Function to handle successful load
        function onIframeLoad() {
            if (hasLoaded) return;
            
            clearTimeout(loadTimeout);
            hasLoaded = true;
            hideError();
        }
        
        // Function to handle iframe errors
        function onIframeError() {
            if (hasLoaded) return;
            showError('Failed to load the application. The Google Apps Script web app might be unavailable or the URL is incorrect.');
        }
        
        // Build the full URL with preserved query parameters and hash
        function buildIframeUrl() {
            let url = GAS_WEBAPP_URL;
            
            // Preserve URL parameters from the wrapper URL
            const params = new URLSearchParams(window.location.search);
            const hash = window.location.hash;
            
            if (params.toString()) {
                url += '?' + params.toString();
            }
            
            if (hash) {
                url += (params.toString() ? '&' : '?') + 'hash=' + encodeURIComponent(hash.substring(1));
            }
            
            return url;
        }
        
        // Attach listeners before setting src so a fast load cannot be missed.
        iframe.addEventListener('load', onIframeLoad);
        iframe.addEventListener('error', onIframeError);

        // Set iframe source.
        const iframeUrl = buildIframeUrl();
        iframe.src = iframeUrl;

        // Google Apps Script may need extra time to initialize inside an iframe.
        loadTimeout = setTimeout(() => {
            if (!hasLoaded) {
                showError('The application is taking longer than expected to load. Please try again.');
            }
        }, 45000);
        
        // Optional: Handle postMessage communication from the embedded app
        window.addEventListener('message', function(event) {
            // Verify origin for security (optional but recommended)
            if (event.origin !== 'https://script.google.com') return;
            
            // Handle different message types from your Apps Script app
            if (event.data && event.data.type) {
                switch(event.data.type) {
                    case 'navigate':
                        // Update URL without reloading
                        if (event.data.url && event.data.url !== window.location.pathname) {
                            history.pushState(null, '', event.data.url);
                        }
                        break;
                    case 'setTitle':
                        if (event.data.title) {
                            document.title = event.data.title;
                        }
                        break;
                    case 'ready':
                        console.log('Apps Script app is ready');
                        break;
                }
            }
        });
        
        // Handle browser back/forward buttons
        window.addEventListener('popstate', function() {
            // Send message to iframe about URL change
            iframe.contentWindow.postMessage({
                type: 'popstate',
                url: window.location.href
            }, '*');
        });
        
        // Log successful setup (for debugging)
        console.log('GitHub Pages wrapper loaded. Iframe URL:', iframeUrl);
    </script>
